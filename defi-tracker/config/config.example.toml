# DeFi valuation tracker configuration.
# Copy to config/config.toml and edit. Nothing here needs an API key except the
# optional Claude classifier (ANTHROPIC_API_KEY) and the CoinGecko demo key
# (COINGECKO_API_KEY) — everything else runs keyless.

[core]
db_path   = "data/dft.db"
out_dir   = "out"
benchmark = "BTC"          # outcome scoring is measured against this asset

[http]
user_agent      = "dft/0.1 (personal research tracker)"
timeout_seconds = 20
max_retries     = 3
# Politeness delay between calls to the same host, seconds.
min_interval     = { "api.llama.fi" = 0.2, "api.coingecko.com" = 0.7, "api.coinpaprika.com" = 0.3, "api.binance.com" = 0.2, "fapi.binance.com" = 0.2 }

[screen]
# Minimum annualised fees for a protocol to enter the multiples screen. Below
# this the ratio is arithmetic noise.
min_annualised_fees_usd = 2_000_000
# Categories where DeFiLlama TVL is most prone to double-counting; flagged, not excluded.
double_count_categories = ["Liquid Staking", "Restaking", "Liquid Restaking", "Bridge", "CDP", "Yield"]
# Extra protocols to screen that have no token in [[assets]].
protocols = ["lido", "jito-liquid-staking", "raydium-amm", "pancakeswap-amm"]

[percentiles]
lookback_days = 365   # trailing window for time-series percentile ranks
min_obs       = 30    # below this, a percentile is reported as unavailable

[signals]
# Cross-sectional multiples: flag the cheapest/most expensive tails.
ps_cheap_percentile     = 20    # P/S in the bottom fifth of its category
ps_expensive_percentile = 90
# Time-series flags: |percentile| of the trailing-year distribution.
tvl_change_percentile   = 95
funding_percentile      = 95    # crowding gauge — context, never a standalone signal
stablecoin_percentile   = 90
mcap_tvl_cheap          = 0.5

[news]
lookback_hours        = 36
title_similarity      = 0.82   # SequenceMatcher ratio above which two headlines are one story
surface_materiality   = 3      # only 3s reach the digest
classify_batch_size   = 20
model                 = "claude-opus-5"

[[news.feeds]]
name = "Cointelegraph"
url  = "https://cointelegraph.com/rss"

[[news.feeds]]
name = "The Block"
url  = "https://www.theblock.co/rss.xml"

[[news.feeds]]
name = "Decrypt"
url  = "https://decrypt.co/feed"

[[news.feeds]]
name = "CoinDesk"
url  = "https://www.coindesk.com/arc/outboundfeeds/rss/"

[[news.feeds]]
name = "The Defiant"
url  = "https://thedefiant.io/api/feed"

[[news.feeds]]
name = "CryptoPanic"
url  = "https://cryptopanic.com/news/rss/"

